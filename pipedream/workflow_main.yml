name: PreMortem AI – Main Pipeline
version: 1.0.0
description: >
  End-to-end workflow for automated pre-mortem analysis:
  discovery → scoring → themes → mitigations → summary → report assembly.

# -------------------------------------------------
# TRIGGER
# -------------------------------------------------
trigger:
  type: http
  name: project_description_webhook

# -------------------------------------------------
# ENVIRONMENT VARIABLES (Required)
# -------------------------------------------------
env:
  OPENAI_API_KEY: "{{ $.env.OPENAI_API_KEY }}"
  MODEL_NAME: "gpt-4.1"   # or "gpt-5.1" if available
  DISCOVERY_PROMPT: "{{ $.steps.loadPrompts.discovery }}"
  SCORING_PROMPT: "{{ $.steps.loadPrompts.scoring }}"
  THEME_PROMPT: "{{ $.steps.loadPrompts.theme }}"
  MITIGATION_PROMPT: "{{ $.steps.loadPrompts.mitigation }}"
  SUMMARY_PROMPT: "{{ $.steps.loadPrompts.summary }}"
  FINAL_REPORT_PROMPT: "{{ $.steps.loadPrompts.final_report }}"

# -------------------------------------------------
# STEPS
# -------------------------------------------------
steps:

  # -------------------------------------------------
  # Load prompt files from GitHub
  # -------------------------------------------------
  loadPrompts:
    title: Load Pipeline Prompts
    description: Loads markdown prompts from GitHub repository.
    run:
      kind: nodejs
      code: |
        const axios = require("axios");

        async function load(path) {
          const url = `https://raw.githubusercontent.com/YOUR_USERNAME/premortem-ai/main/prompts/${path}`;
          const res = await axios.get(url);
          return res.data;
        }

        return {
          discovery: await load("premortem_discovery.md"),
          scoring: await load("risk_scoring_prompt.md"),
          theme: await load("risk_theme_prompt.md"),
          mitigation: await load("mitigation_prompt.md"),
          summary: await load("summary_prompt.md"),
          final_report: await load("final_report_prompt.md")
        };

  # -------------------------------------------------
  # 1. DISCOVERY
  # -------------------------------------------------
  discoverRisks:
    title: Risk Discovery
    description: Extracts a full list of risks from the project description.
    run:
      kind: nodejs
      code: |
        const openai = require("openai");
        const client = new openai.OpenAI({ apiKey: process.env.OPENAI_API_KEY });

        const prompt = `${steps.loadPrompts.discovery}\n\n${steps.trigger.event.body.project_description}`;
        const response = await client.chat.completions.create({
          model: process.env.MODEL_NAME,
          messages: [{ role: "user", content: prompt }],
          temperature: 0.2
        });

        return JSON.parse(response.choices[0].message.content);

  # -------------------------------------------------
  # 2. SCORING
  # -------------------------------------------------
  scoreRisks:
    title: Score Risks
    description: Assign probability, impact, severity scores, and reasoning.
    run:
      kind: nodejs
      code: |
        const openai = require("openai");
        const client = new openai.OpenAI({ apiKey: process.env.OPENAI_API_KEY });

        const input = JSON.stringify(steps.discoverRisks);

        const prompt = `${steps.loadPrompts.scoring}\n\n${input}`;
        const response = await client.chat.completions.create({
          model: process.env.MODEL_NAME,
          messages: [{ role: "user", content: prompt }],
          temperature: 0.1
        });

        return JSON.parse(response.choices[0].message.content);

  # -------------------------------------------------
  # 3. THEMES
  # -------------------------------------------------
  themeRisks:
    title: Theme Clustering
    description: Groups risks into meaningful patterns.
    run:
      kind: nodejs
      code: |
        const openai = require("openai");
        const client = new openai.OpenAI({ apiKey: process.env.OPENAI_API_KEY });

        const input = JSON.stringify(steps.scoreRisks);

        const prompt = `${steps.loadPrompts.theme}\n\n${input}`;
        const response = await client.chat.completions.create({
          model: process.env.MODEL_NAME,
          messages: [{ role: "user", content: prompt }],
          temperature: 0.1
        });

        return JSON.parse(response.choices[0].message.content);

  # -------------------------------------------------
  # 4. MITIGATIONS
  # -------------------------------------------------
  mitigationStrategies:
    title: Mitigation Creation
    description: Generates actionable mitigations for each risk.
    run:
      kind: nodejs
      code: |
        const openai = require("openai");
        const client = new openai.OpenAI({ apiKey: process.env.OPENAI_API_KEY });

        const input = JSON.stringify(steps.scoreRisks);

        const prompt = `${steps.loadPrompts.mitigation}\n\n${input}`;
        const response = await client.chat.completions.create({
          model: process.env.MODEL_NAME,
          messages: [{ role: "user", content: prompt }],
          temperature: 0.3
        });

        return JSON.parse(response.choices[0].message.content);

  # -------------------------------------------------
  # 5. EXECUTIVE SUMMARY
  # -------------------------------------------------
  generateSummary:
    title: Summary Generation
    description: Produces a non-technical executive summary.
    run:
      kind: nodejs
      code: |
        const openai = require("openai");
        const client = new openai.OpenAI({ apiKey: process.env.OPENAI_API_KEY });

        const input = JSON.stringify(steps.scoreRisks);
        const prompt = `${steps.loadPrompts.summary}\n\n${input}`;

        const response = await client.chat.completions.create({
          model: process.env.MODEL_NAME,
          messages: [{ role: "user", content: prompt }],
          temperature: 0.4
        });

        return response.choices[0].message.content;

  # -------------------------------------------------
  # 6. FINAL REPORT
  # -------------------------------------------------
  finalReport:
    title: Final Report Assembly
    description: Builds the complete pre-mortem analysis document.
    run:
      kind: nodejs
      code: |
        const openai = require("openai");
        const client = new openai.OpenAI({ apiKey: process.env.OPENAI_API_KEY });

        const payload = {
          risks: steps.scoreRisks,
          themes: steps.themeRisks,
          mitigations: steps.mitigationStrategies,
          summary: steps.generateSummary
        };

        const prompt = `${steps.loadPrompts.final_report}\n\n${JSON.stringify(payload)}`;

        const response = await client.chat.completions.create({
          model: process.env.MODEL_NAME,
          messages: [{ role: "user", content: prompt }],
          temperature: 0.2
        });

        return response.choices[0].message.content;

  # -------------------------------------------------
  # FINAL OUTPUT
  # -------------------------------------------------
  respond:
    title: Return Pipeline Result
    run:
      kind: nodejs
      code: |
        return {
          project_description: steps.trigger.event.body.project_description,
          discovered_risks: steps.discoverRisks,
          scored_risks: steps.scoreRisks,
          themes: steps.themeRisks,
          mitigations: steps.mitigationStrategies,
          summary: steps.generateSummary,
          final_report: steps.finalReport
        };
