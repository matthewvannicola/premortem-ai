name: final_report
version: "1.0.0"

description: >
  Produces the complete, structured final report for a PreMortem AI assessment.
  This includes the executive summary, full risk list, severity distribution,
  themes, and mitigation guidance. The output is consumed by the pdf_export step
  and is formatted for downstream rendering, dashboards, and archival.

  # Input shape (example):
  # {
  #   "risks": [...],         # scored risks
  #   "themes": [...],        # theme clusters
  #   "mitigations": [...],   # mitigation strategy objects
  #   "summary": {...}        # executive summary
  # }

  # Output shape (example):
  # {
  #   "final_report": {
  #     "executive_summary": { ... },
  #     "risk_overview": { ... },
  #     "themes": [...],
  #     "mitigations": [...],
  #     "top_risks": [...],
  #     "metadata": {
  #       "generated_at": "ISO timestamp",
  #       "version": "1.0"
  #     }
  #   }
  # }

type: action
displayName: Final Report – Full Structured Output
packageName: premortem-ai
icon: https://raw.githubusercontent.com/matthewvannicola/premortem-ai/main/assets/icon.png

props:
  risks:
    type: object
    label: Scored Risks Array
    description: Full array of scored risks.
    required: true

  themes:
    type: object
    label: Themes Array
    description: Risk themes generated by the themes component.
    required: true

  mitigations:
    type: object
    label: Mitigations Array
    description: Risk mitigation strategies.
    required: true

  summary:
    type: object
    label: Executive Summary
    description: Summary object created by the summary component.
    required: true

run:
  async (context) => {

    //
    // -------------------------------
    // INPUT VALIDATION
    // -------------------------------
    //
    const { risks, themes, mitigations, summary } = context.props;

    if (!Array.isArray(risks) || risks.length === 0) {
      throw new Error("Input 'risks' must be a non-empty array.");
    }

    if (!Array.isArray(themes) || themes.length === 0) {
      throw new Error("Input 'themes' must be a non-empty array.");
    }

    if (!Array.isArray(mitigations) || mitigations.length === 0) {
      throw new Error("Input 'mitigations' must be a non-empty array.");
    }

    if (typeof summary !== "object" || !summary.overview) {
      throw new Error("Input 'summary' must be a valid summary object.");
    }

    //
    // -------------------------------
    // NORMALIZATION
    // -------------------------------
    //
    const normalized = {
      risks,
      themes,
      mitigations,
      summary
    };

    //
    // -------------------------------
    // LLM PROMPT
    // -------------------------------
    //
    const prompt = `
You are PreMortem AI. Generate the complete final report object in structured JSON.

The final report MUST include:

"executive_summary":
  - overview
  - key_themes
  - top_risks
  - recommended_focus

"risk_overview":
  - total_risks
  - average_severity
  - severity_distribution (counts for low, medium, high)
  - highest_risk (id, title, severity_score)

"themes": full theme objects

"mitigations": full mitigation objects

"top_risks": top 3–5 highest-severity risks

"metadata":
  - generated_at (ISO timestamp)
  - version: "1.0"

Rules:
- Return ONLY valid JSON.
- Must not introduce new risks or themes.
- All references MUST match IDs from the input.

Here is the full dataset:
${JSON.stringify(normalized, null, 2)}
`;

    //
    // -------------------------------
    // LLM EXECUTION
    // -------------------------------
    //
    const response = await context.$ai.run("gpt-4.1", {
      messages: [
        { role: "system", content: "You are an AI report generator for risk analysis." },
        { role: "user", content: prompt }
      ],
      response_format: {
        type: "json_schema",
        schema: {
          type: "object",
          properties: {
            final_report: {
              type: "object",
              properties: {
                executive_summary: {
                  type: "object",
                  properties: {
                    overview: { type: "string" },
                    key_themes: {
                      type: "array",
                      items: { type: "string" }
                    },
                    top_risks: {
                      type: "array",
                      items: {
                        type: "object",
                        properties: {
                          id: { type: "string" },
                          title: { type: "string" },
                          severity_score: { type: "number" }
                        },
                        required: ["id", "title", "severity_score"]
                      }
                    },
                    recommended_focus: { type: "string" }
                  },
                  required: ["overview", "key_themes", "top_risks", "recommended_focus"]
                },

                risk_overview: {
                  type: "object",
                  properties: {
                    total_risks: { type: "number" },
                    average_severity: { type: "number" },
                    severity_distribution: {
                      type: "object",
                      properties: {
                        low: { type: "number" },
                        medium: { type: "number" },
                        high: { type: "number" }
                      },
                      required: ["low", "medium", "high"]
                    },
                    highest_risk: {
                      type: "object",
                      properties: {
                        id: { type: "string" },
                        title: { type: "string" },
                        severity_score: { type: "number" }
                      },
                      required: ["id", "title", "severity_score"]
                    }
                  },
                  required: ["total_risks", "average_severity", "severity_distribution", "highest_risk"]
                },

                themes: {
                  type: "array",
                  items: { type: "object" }
                },

                mitigations: {
                  type: "array",
                  items: { type: "object" }
                },

                top_risks: {
                  type: "array",
                  items: { type: "object" }
                },

                metadata: {
                  type: "object",
                  properties: {
                    generated_at: { type: "string" },
                    version: { type: "string" }
                  },
                  required: ["generated_at", "version"]
                }
              },
              required: ["executive_summary", "risk_overview", "themes", "mitigations", "top_risks", "metadata"]
            }
          },
          required: ["final_report"]
        }
      }
    });

    //
    // -------------------------------
    // RETURN OUTPUT
    // -------------------------------
    //
    return {
      final_report: response.final_report
    };
  }
